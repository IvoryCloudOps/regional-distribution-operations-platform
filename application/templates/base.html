<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Distribution Operations{% endblock %} - Regional Distribution Ops</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">Regional Distribution Operations</div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('inventory') }}">Inventory</a>
      <a href="{{ url_for('orders') }}">Orders</a>
      <a href="{{ url_for('shipments') }}">Shipments</a>
      <a href="{{ url_for('warehouses') }}">Warehouses</a>
      <a href="{{ url_for('reports') }}">Reports</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Internal use only &middot; synthetic demo data</footer>
</body>
</html>
